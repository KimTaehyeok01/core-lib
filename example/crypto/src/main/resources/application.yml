server:
  port: 8103

spring:
  application:
    name: example-crypto
  output:
    ansi:
      enabled: always       # IntelliJ 콘솔에서도 색 표시 (CORE 로고 노란색)

example:
  crypto:
    # base64 로 인코딩한 32byte 키 — 환경변수로만 주입한다 (비우면 기동 시 임시 키 생성)
    aes-key: ${CRYPTO_AES_KEY:}
    index-key: ${CRYPTO_INDEX_KEY:}       # 이메일 검색 인덱스(HMAC) 키 — 암호화 키와 분리
    # true 면 저장 형태 확인 API(/api/customers/stored-rows)를 연다 — 인증 없이 암호문·인덱스가 나가므로 기본 false (꺼져 있으면 404)
    debug-endpoints: ${CRYPTO_DEBUG_ENDPOINTS:false}
