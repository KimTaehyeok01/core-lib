server:
  port: 8110

spring:
  application:
    name: example-payment-toss

# 토스 개발자센터(developers.tosspayments.com) 가입 → 테스트 상점의 "API 개별 연동 키" 를 환경변수로
# (비우면 자동설정이 꺼져 결제 시 설정 오류를 안내한다)
payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY:}       # test_sk_... — 서버 전용, 브라우저에 노출 금지

example:
  toss:
    client-key: ${TOSS_CLIENT_KEY:}       # test_ck_... — 결제창 SDK 용
