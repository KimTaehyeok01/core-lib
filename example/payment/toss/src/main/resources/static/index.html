<!doctype html>
<!-- 토스 결제 예제 화면: 주문 생성(서버가 금액 결정) → 결제창 SDK v2 requestPayment → successUrl/failUrl -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토스페이먼츠 결제 예제</title>
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
	body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
	label { display: block; margin-top: 12px; font-weight: bold; }
	input, select { width: 100%; padding: 8px; box-sizing: border-box; }
	button { margin-top: 16px; padding: 10px 20px; }
	.error { color: #c00; }
</style>
</head>
<body>
<h1>토스페이먼츠 결제 예제</h1>
<form id="orderForm">
	<label for="orderName">상품명</label>
	<input id="orderName" required value="core-lib 티셔츠">
	<label for="amount">금액</label>
	<input id="amount" type="number" min="100" required value="15000">
	<label for="method">결제수단</label>
	<select id="method">
		<option value="CARD">카드</option>
		<option value="TRANSFER">계좌이체</option>
		<option value="VIRTUAL_ACCOUNT">가상계좌</option>
	</select>
	<button type="submit">결제하기</button>
</form>
<p id="message"></p>

<script>
	const message = document.getElementById('message');

	document.getElementById('orderForm').addEventListener('submit', async (event) => {
		event.preventDefault();
		// 1. 주문 생성 — 금액은 서버가 저장하고, 승인 때 서버 값으로 다시 확인한다
		const body = await (await fetch('/api/toss/orders/create', {
			method: 'POST',
			headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({
				orderName: document.getElementById('orderName').value,
				amount: Number(document.getElementById('amount').value)
			})
		})).json();
		if (!body.success) {
			message.className = 'error';
			message.textContent = '[' + body.code + '] ' + body.message;
			return;
		}
		const order = body.data;
		if (!order.clientKey) {
			message.className = 'error';
			message.textContent = 'TOSS_CLIENT_KEY 가 설정되지 않았습니다. README 를 확인하세요.';
			return;
		}

		// 2. 결제창 호출 — 비회원 결제(ANONYMOUS). 회원이면 customerKey 에 회원별 UUID
		try {
			const payment = TossPayments(order.clientKey).payment({customerKey: TossPayments.ANONYMOUS});
			await payment.requestPayment({
				method: document.getElementById('method').value,
				amount: {currency: 'KRW', value: order.amount},
				orderId: order.orderId,
				orderName: order.orderName,
				successUrl: location.origin + '/toss/success',
				failUrl: location.origin + '/toss/fail'
			});
		} catch (error) {
			message.className = 'error';
			message.textContent = '결제창 오류: ' + (error.message || error);
		}
	});
</script>
</body>
</html>
