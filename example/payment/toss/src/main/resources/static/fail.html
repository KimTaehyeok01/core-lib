<!doctype html>
<!-- 결제 실패 화면 (사용자 취소·거절·위변조) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>결제 실패</title>
<style>body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }</style>
</head>
<body>
<h1>결제가 완료되지 않았습니다</h1>
<p id="message"></p>
<p><a href="/">다시 주문하기</a></p>
<script>
	const params = new URLSearchParams(location.search);
	const code = params.get('code');
	document.getElementById('message').textContent =
		code === 'PAY_PROCESS_CANCELED' ? '결제를 취소했습니다.' : (params.get('message') || '알 수 없는 오류');
</script>
</body>
</html>
