<!doctype html>
<!-- 나이스페이 결제 예제 화면: 주문 생성(서버가 금액 결정) → AUTHNICE.requestPay → returnUrl(form POST) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나이스페이먼츠 결제 예제</title>
<script src="https://pay.nicepay.co.kr/v1/js/"></script>
<style>
	body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
	label { display: block; margin-top: 12px; font-weight: bold; }
	input, select { width: 100%; padding: 8px; box-sizing: border-box; }
	button { margin-top: 16px; padding: 10px 20px; }
	.error { color: #c00; }
</style>
</head>
<body>
<h1>나이스페이먼츠 결제 예제</h1>
<form id="orderForm">
	<label for="goodsName">상품명</label>
	<input id="goodsName" required maxlength="40" value="core-lib 머그컵">
	<label for="amount">금액</label>
	<input id="amount" type="number" min="100" required value="12000">
	<label for="method">결제수단</label>
	<select id="method">
		<option value="card">카드</option>
		<option value="bank">계좌이체</option>
		<option value="vbank">가상계좌</option>
	</select>
	<button type="submit">결제하기</button>
</form>
<p id="message"></p>

<script>
	const message = document.getElementById('message');

	function showError(text) {
		message.className = 'error';
		message.textContent = text;
	}

	document.getElementById('orderForm').addEventListener('submit', async (event) => {
		event.preventDefault();
		// 1. 주문 생성 — 금액은 서버가 저장하고, returnUrl 에서 서버 값으로 검증한다
		const body = await (await fetch('/api/nicepay/orders/create', {
			method: 'POST',
			headers: {'Content-Type': 'application/json'},
			body: JSON.stringify({
				goodsName: document.getElementById('goodsName').value,
				amount: Number(document.getElementById('amount').value)
			})
		})).json();
		if (!body.success) {
			showError('[' + body.code + '] ' + body.message);
			return;
		}
		const order = body.data;
		if (!order.clientId) {
			showError('NICEPAY_CLIENT_KEY 가 설정되지 않았습니다. README 를 확인하세요.');
			return;
		}

		// 2. 결제창 호출 — 인증이 끝나면 NICEPAY 가 returnUrl 로 form POST 한다
		AUTHNICE.requestPay({
			clientId: order.clientId,
			method: document.getElementById('method').value,
			orderId: order.orderId,
			amount: order.amount,
			goodsName: order.goodsName,
			returnUrl: location.origin + '/nicepay/return',
			fnError: (result) => showError('결제창 오류: ' + result.errorMsg)
		});
	});
</script>
</body>
</html>
