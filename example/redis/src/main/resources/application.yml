server:
  port: 8118

spring:
  application:
    name: redis-example
  data:
    redis:
      # 로컬 단일 노드 — 아래 sentinel / cluster 주석을 참고해 토폴로지만 바꾸면 그대로 동작한다
      host: localhost
      port: 6379
      # password: ${REDIS_PASSWORD}      # 비밀번호가 필요한 서비스만 — 리터럴 금지, 환경변수로 주입
      # timeout: 2s                      # Lettuce 명령 timeout (core 기본 10s)

      # --- Sentinel 토폴로지 예시 (host 는 지우거나 비워 둔다) ---
      # sentinel:
      #   master: mymaster
      #   nodes:                         # scheme 없이 host:port — IPv6 는 [::1]:26379 처럼 대괄호
      #     - sentinel-1:26379
      #     - sentinel-2:26379
      #   password: ${REDIS_SENTINEL_PASSWORD}

      # --- Cluster 토폴로지 예시 (cluster 가 있으면 sentinel·host 보다 우선) ---
      # cluster:
      #   nodes:
      #     - node-1:7000
      #     - node-2:7000
      #   max-redirects: 3

core:
  redis:
    # 모든 Redis 키·캐시 이름·락 키 앞에 "redis-example:" 로 붙는다 (환경·서비스가 Redis 를 공유할 때)
    key-prefix: redis-example
    lock:
      long-hold-warn-threshold: 60s        # 락을 60s 넘게 잡고 있으면 warn 로그. 0 이면 끔
    trusted-packages:                      # Redis 에 저장한 DTO 를 다시 읽으려면 그 패키지를 넣는다
      - com.corelib.example.redis
