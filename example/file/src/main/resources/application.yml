server:
  port: 8107

spring:
  application:
    name: example-file
  servlet:
    multipart:
      # core.file.max-size 와 맞춘다 (요청 전체는 조금 더 크게)
      max-file-size: 10MB
      max-request-size: 11MB

core:
  file:
    storage: local                    # s3 로 바꾸려면 아래 s3 설정 + software.amazon.awssdk:s3 의존성
    max-size: 10MB
    allowed-extensions: [png, jpg, jpeg, gif, pdf, txt, xlsx, docx]
    local:
      base-dir: ${FILE_BASE_DIR:./uploads}
#    s3:
#      bucket: ${S3_BUCKET}
#      region: ap-northeast-2
#      # 자격증명은 AWS 기본 체인(AWS_ACCESS_KEY_ID 환경변수·프로필·IAM Role) — 여기 적지 않는다
