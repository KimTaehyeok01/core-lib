// example-file: file 모듈(FileUtils·로컬/S3 저장소) 사용 예제 — http://localhost:8107

dependencies {
    implementation project(':modules:file')
    implementation project(':modules:common')
    implementation 'org.springframework.boot:spring-boot-starter-validation'    // ValidateUtils 구현체
    // S3 저장소로 바꿀 때만 추가: implementation 'software.amazon.awssdk:s3:2.55.13' + core.file.storage=s3
}
