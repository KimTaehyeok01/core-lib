<!doctype html>
<!-- NICE 통합인증 예제 화면: [인증하기] → 표준창 팝업 → 완료 알림(postMessage) → 결과 조회 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NICE 본인인증 예제</title>
<style>
	body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
	button { padding: 10px 20px; }
	dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px; }
	.error { color: #c00; }
</style>
</head>
<body>
<h1>NICE 본인인증 예제</h1>
<button id="startButton">본인인증 하기</button>
<p id="message"></p>
<dl id="result"></dl>

<h2>가입 회원</h2>
<ul id="members"></ul>

<script>
	const message = document.getElementById('message');

	function showError(text) {
		message.className = 'error';
		message.textContent = text;
	}

	document.getElementById('startButton').addEventListener('click', async () => {
		// 팝업 차단을 피하려고 클릭 직후 빈 창을 먼저 연다
		const popup = window.open('about:blank', 'niceAuth', 'width=480,height=812');
		const body = await (await fetch('/api/nice-auth/start', {method: 'POST'})).json();
		if (!body.success) {
			popup && popup.close();
			showError('[' + body.code + '] ' + body.message);
			return;
		}
		popup.location.href = body.data.authUrl;    // 표준창 URL 그대로
		message.className = '';
		message.textContent = '인증 창에서 진행해 주세요.';
	});

	// done.html(팝업)이 보내는 완료 알림 — 같은 출처에서 온 메시지만 받는다
	window.addEventListener('message', async (event) => {
		if (event.origin !== location.origin || !event.data || event.data.type !== 'nice-auth-done') {
			return;
		}
		if (!event.data.isSuccess) {
			showError('인증 실패: ' + (event.data.message || ''));
			return;
		}
		const body = await (await fetch('/api/nice-auth/result')).json();
		if (!body.success) {
			showError('[' + body.code + '] ' + body.message);
			return;
		}
		message.className = '';
		message.textContent = body.data.isNewMember ? '가입 완료 — 환영합니다.' : '기존 회원으로 로그인했습니다.';
		const result = document.getElementById('result');
		result.replaceChildren();
		const rows = {
			'회원번호': body.data.memberId, '이름': body.data.maskedName, '생년': body.data.birthYear, '만 나이': body.data.age,
			'성별': body.data.gender === '1' ? '남' : '여', '내외국인': body.data.nationalInfo === '0' ? '내국인' : '외국인',
			'휴대폰': body.data.maskedMobileNo, '가입일시': body.data.joinedAt
		};
		Object.entries(rows).forEach(([label, value]) => {
			const dt = document.createElement('dt');
			dt.textContent = label;
			const dd = document.createElement('dd');
			dd.textContent = value ?? '-';
			result.append(dt, dd);
		});
		loadMembers();
	});

	async function loadMembers() {
		const body = await (await fetch('/api/nice-auth/members/list')).json();
		const list = document.getElementById('members');
		list.replaceChildren();
		(body.data || []).forEach((member) => {
			const item = document.createElement('li');
			item.textContent = '#' + member.memberId + ' ' + member.maskedName + ' ' + (member.maskedMobileNo ?? '') + ' (최근 인증 ' + member.lastVerifiedAt + ')';
			list.append(item);
		});
	}

	loadMembers();
</script>
</body>
</html>
