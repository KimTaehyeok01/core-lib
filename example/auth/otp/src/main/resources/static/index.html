<!doctype html>
<!-- 2단계 인증 예제 화면: 등록(QR) → 활성화 → 로그인 검증 → 해제 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2단계 인증(OTP) 예제</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
	body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
	label { display: block; margin-top: 12px; font-weight: bold; }
	input { width: 100%; padding: 8px; box-sizing: border-box; }
	button { margin-top: 12px; padding: 10px 16px; margin-right: 6px; }
	#qr { margin-top: 16px; }
	code { font-size: 18px; letter-spacing: 2px; }
	.error { color: #c00; }
	.ok { color: #070; }
</style>
</head>
<body>
<h1>2단계 인증(OTP)</h1>
<p>Google Authenticator·Microsoft Authenticator 같은 OTP 앱으로 QR 을 찍으세요.</p>

<label for="memberId">회원 ID (예제라 직접 입력)</label>
<input id="memberId" value="member-1">
<label for="accountName">계정 이름</label>
<input id="accountName" value="hong@example.com">
<button id="setupButton">1. 등록 시작</button>

<div id="qr"></div>
<p id="manualKey"></p>

<label for="code">OTP 앱의 6자리 코드</label>
<input id="code" inputmode="numeric" maxlength="6">
<button data-action="activate">2. 활성화</button>
<button data-action="verify">로그인 검증</button>
<button data-action="disable">해제</button>
<p id="message"></p>

<script>
	const message = document.getElementById('message');
	const show = (text, isError) => { message.className = isError ? 'error' : 'ok'; message.textContent = text; };
	const postJson = async (url, data) => (await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)})).json();

	document.getElementById('setupButton').addEventListener('click', async () => {
		const body = await postJson('/api/otp/setup', {
			memberId: document.getElementById('memberId').value,
			accountName: document.getElementById('accountName').value
		});
		if (!body.success) { show('[' + body.code + '] ' + body.message, true); return; }
		const qr = document.getElementById('qr');
		qr.replaceChildren();
		new QRCode(qr, {text: body.data.otpauthUri, width: 200, height: 200});
		const manual = document.getElementById('manualKey');
		manual.textContent = '직접 입력: ';
		const code = document.createElement('code');
		code.textContent = body.data.manualKey;
		manual.append(code);
		show('QR 을 찍고 앱에 나온 코드로 활성화하세요.', false);
	});

	document.querySelectorAll('[data-action]').forEach((button) => button.addEventListener('click', async () => {
		const body = await postJson('/api/otp/' + button.dataset.action, {
			memberId: document.getElementById('memberId').value,
			code: document.getElementById('code').value
		});
		body.success
			? show(button.textContent + ' 성공 — 사용 ' + (body.data.enabled ? '중' : '안 함'), false)
			: show('[' + body.code + '] ' + body.message, true);
	}));
</script>
</body>
</html>
