server:
  port: 8105

spring:
  application:
    name: example-swagger
  output:
    ansi:
      enabled: always       # IntelliJ 콘솔에서도 색 표시 (CORE 로고 노란색)

core:
  swagger:
    title: core-lib 예제 API
    description: swagger 모듈 사용 예제 — 우측 상단 Authorize 에 JWT 를 넣으면 자물쇠 API 에 Bearer 헤더가 붙는다
    version: v1
    # 공통 에러 응답 — enabled 한 줄로 켜고 끈다 (기본값: true / [400, 404, 500] / [401, 403])
    error-responses:
      enabled: true
      codes: [400, 404, 500]        # 모든 API
      secured-codes: [401, 403]     # @SecurityRequirement 가 붙은 API 에만

# springdoc 기본값: UI /swagger-ui.html, 문서 JSON /v3/api-docs
# core 가 넣는 UI 기본값(바꾸려면 아래 키를 직접 적는다):
#   springdoc.swagger-ui.doc-expansion: none              API 목록 접힌 상태로 시작
#   springdoc.swagger-ui.default-models-expand-depth: -1  맨 아래 Schemas 영역 숨김
# 운영에서 문서를 숨기려면 springdoc.api-docs.enabled=false, springdoc.swagger-ui.enabled=false
# web 모듈 + spring-boot-starter-security 와 함께 쓰면 문서 경로는 기본 비공개(인증 필요) — 이 예제는 web 모듈이 없어 그냥 열린다.
# 그 구성에서 문서를 공개하려면 아래를 켠다.
# core:
#   web:
#     security:
#       public-docs: true    # /swagger-ui/**, /v3/api-docs/** 를 인증 없이 연다 (운영은 false 권장)
