server:
  port: 8106

spring:
  application:
    name: example-mail
  output:
    ansi:
      enabled: always       # IntelliJ 콘솔에서도 색 표시 (CORE 로고 노란색)
  # SMTP — 기본값은 로컬 Mailpit(localhost:1025, 웹 http://localhost:8025)
  # Gmail 예: MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_SMTP_AUTH=true MAIL_STARTTLS=true + 앱 비밀번호
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

core:
  mail:
    from: ${MAIL_FROM:noreply@example.com}

example:
  verification:
    code-ttl: 5m            # 인증코드 유효시간
    resend-cooldown: 60s    # 재발송 대기
