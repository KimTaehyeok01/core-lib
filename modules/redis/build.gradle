// redis: Redis 자료구조 유틸(RedisUtils)·Spring Cache(RedisCacheManager)·분산 락(@RedisLock, Redisson) — 접속은 표준 spring.data.redis.*

dependencies {
    api project(':modules:common')
    api 'org.springframework.boot:spring-boot-starter-data-redis:3.5.16'    // Lettuce 커넥션·RedisTemplate·RedisCacheManager
    api 'org.springframework.boot:spring-boot-starter-json:3.5.16'          // 값 JSON 직렬화 (java.time 포함)
    implementation 'org.redisson:redisson:3.52.0'                           // 분산 락 — 2025-09-25, OSV 0건 (4.x 는 Boot 3.5 BOM 과 reactor 버전이 어긋남)

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.slf4j:slf4j-api'
    compileOnly 'org.springframework:spring-web'                       // RequestContextHolder·ServletRequestAttributes — @RedisLock REQUEST scope
    compileOnly 'org.springframework:spring-webmvc'                    // HandlerMapping.BEST_MATCHING_PATTERN_ATTRIBUTE
    compileOnly 'jakarta.servlet:jakarta.servlet-api'                  // HttpServletRequest

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework:spring-webmvc'    // HandlerMapping.BEST_MATCHING_PATTERN_ATTRIBUTE — 테스트에서 REQUEST scope 패턴 세팅
    testImplementation 'jakarta.servlet:jakarta.servlet-api'  // MockHttpServletRequest 테스트용
    testImplementation 'org.testcontainers:junit-jupiter'    // Redis 통합 테스트 — Docker 가 없으면 건너뛴다
}
