// webclient: 외부 API 호출 공통 (WebFlux WebClient + timeout + 결과확정/불명 분류), testFixtures 로 테스트용 로컬 HTTP 서버 제공

apply plugin: 'java-test-fixtures'

// Boot 3.5.16 기본 netty 4.1.135 는 CVE 10건(CRITICAL 1) — 수정판으로 끌어올린다
def nettyVersion = '4.1.139.Final'
// webflux(reactor-netty) 가 실제로 끌어오는 netty 아티팩트 — `:modules:webclient:dependencies` 로 확인한 목록
def nettyArtifacts = [
    'buffer', 'codec', 'codec-dns', 'codec-http', 'codec-http2', 'codec-socks', 'common',
    'handler', 'handler-proxy', 'resolver', 'resolver-dns', 'resolver-dns-classes-macos', 'resolver-dns-native-macos',
    'transport', 'transport-classes-epoll', 'transport-native-epoll', 'transport-native-unix-common',
]

dependencies {
    api project(':modules:common')
    api 'org.springframework.boot:spring-boot-starter-webflux:3.5.16'
    // platform 은 목록에 없는 netty 아티팩트까지 버전을 맞추고, constraints 는 아티팩트별 버전을 POM dependencyManagement 에 남긴다
    api platform("io.netty:netty-bom:${nettyVersion}")
    constraints {
        nettyArtifacts.each { api "io.netty:netty-${it}:${nettyVersion}" }
    }

    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'ch.qos.logback:logback-classic'
}
