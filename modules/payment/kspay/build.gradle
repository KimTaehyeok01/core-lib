// payment-kspay: KSNET KSPAY 결제 연동 — 승인은 통합모듈(web_host), 취소는 webfep API (paydev.ksnet.co.kr/kspay/webfep/doc)

dependencies {
    api project(':modules:common')
    api project(':modules:webclient')
    api 'org.springframework.boot:spring-boot-starter-validation:3.5.16'    // 요청 DTO 검증(ValidateUtils) 구현체

    compileOnly 'org.springframework:spring-web'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations'
    compileOnly 'org.slf4j:slf4j-api'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation testFixtures(project(':modules:webclient'))
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'ch.qos.logback:logback-classic'
}
